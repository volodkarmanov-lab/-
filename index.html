<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Русский стиль</title>
  
  <!-- Подключаем славянские шрифты от Google -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@700&family=Marck+Script&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #fdf5e6; /* Пергамент */
      color: #4a2c2a; /* Темно-коричневый */
      font-family: 'Cormorant Unicase', serif; /* СТАРИННЫЙ ШРИФТ ДЛЯ ТЕКСТА */
      text-align: center;
      padding-top: 50px;
    }
    
    h1 {
      font-family: 'Marck Script', cursive; /* РУКОПИСНЫЙ ШРИФТ ДЛЯ ЗАГОЛОВКА */
      font-size: 60px; /* Делаем заголовок огромным */
      color: #8b0000; /* Темно-красный (как кровь/сургуч) */
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2); /* Легкая тень для объема */
    }

    button {
      background-color: #8b0000;
      color: white;
      font-family: 'Cormorant Unicase', serif;
      font-size: 18px;
      padding: 10px 20px;
      border: 2px solid #4a2c2a;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>ЙоуЙоу</h1>
  
  <img src="pic.jpg" alt="Моя картинка" style="border: 5px solid #8b0000; border-radius: 10px; max-width: 100%;">
  
  <br><br>
  
  <p>Это моя первая веб-страница. Я учусь делать сайты.</p>
  <p>Я начал учиться программировать.</p>
  
  <br><br>
  
  <button onclick="alert('Привет! Ты нажал на кнопку!')">Нажми на меня</button>
</body>
</html>
